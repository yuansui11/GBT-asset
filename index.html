function compressToDataURL(src,cb){const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{const max=640,sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=img.width*sc;cv.height=img.height*sc;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",0.5));};img.src=e.target.result;};rd.readAsDataURL(src);}
function buildPalette(depts){const m={};let h=210;depts.forEach(d=>{const[r,g,b]=hsv(((h%360)+360)%360/360,0.62,0.7);m[d]=`rgb(${r},${g},${b})`;h+=137.508});return m;}
function hsv(h,s,v){let i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s),r,g,b;[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6].forEach((x,k)=>{if(k===0)r=x;if(k===1)g=x;if(k===2)b=x});return[Math.round(r*255),Math.round(g*255),Math.round(b*255)];}

     {LANGS.map(([k,lb])=><button key={k} onClick={()=>setLang(k)} style={{background:lang===k?AI:"#fff",color:lang===k?"#fff":"#6E6B62",border:`1px solid ${lang===k?AI:LINE}`}} className="h-6 px-1.5 rounded text-[10.5px] leading-none">{lb}</button>)}
     {isSuper&&<button onClick={()=>setPermOpen(true)} className="h-6 px-2 rounded text-[10.5px]" style={{border:`1px solid ${LINE}`,color:AI}}>{t("permMgmt")}</button>}
     <button onClick={logout} className="h-6 px-2 rounded text-[10.5px]" style={{border:`1px solid ${LINE}`,color:SUB}}>{t("logout")}</button>
    </div>
   </div>
   <div className="pb-20 sm:pb-0">
    {view==="dash"&&<Dashboard assets={assets} PAL={PAL} onGoto={gotoLedger} onOpen={open}/>}

    {view==="transfer"&&<Transfers assets={assets} open={open}/>}
    {view==="dispose"&&<Disposal assets={assets} open={open}/>}

   </div>
   <div className="sm:hidden fixed bottom-0 left-0 right-0 z-30 flex" style={{background:"rgba(251,250,247,.96)",backdropFilter:"blur(6px)",borderTop:`1px solid ${LINE}`}}>
    {NAVK.map(([k,ic])=>{const on=view===k;return <button key={k} onClick={()=>setView(k)} className="flex-1 flex flex-col items-center justify-center gap-0.5 py-2" style={{color:on?AI:"#8A8781"}}><Svg n={ic} s={18}/><span className="text-[9.5px] leading-none">{t(k)}</span></button>;})}
   </div>
  </div>

  {cur&&<Drawer {...{cur,photos:photos[cur.id]||[],edit,setEdit,patch,addPhotoFiles,delPhotoIdx,openCamera:setCamFor,close:()=>setSel(null),transfer:()=>setModal("transfer"),dispose:()=>setModal("dispose"),print:()=>setPrintA(cur)}}/>}
  {modal==="add"&&<AddModal depts={depts} cats={cats} onClose={()=>setModal(null)} onSave={a=>{DB.collection("assets").doc(String(a.id)).set({...a,add:true,hist:[{d:today(),t:"新增",x:"手动新增资产"}]});setModal(null);}}/>}
  {modal==="transfer"&&cur&&<TransferModal cur={cur} onClose={()=>setModal(null)} onSave={f=>{patch(cur.id,{user:f.user,manager:f.manager,location:f.location},{d:f.date,t:"划拨",x:`${f.from||"—"} → ${f.user||"—"}${f.location?"，"+f.location:""}${f.note?"（"+f.note+"）":""}`});setModal(null);}}/>}
  {modal==="dispose"&&cur&&<DisposeModal onClose={()=>setModal(null)} onSave={f=>{patch(cur.id,{status:f.status,disp:f.status},{d:f.date,t:f.status,x:f.reason||f.status});setModal(null);}}/>}
  {printA&&<PrintLabel a={printA} onDone={()=>setPrintA(null)}/>}
  {printBatch&&<BatchPrint list={printBatch} onDone={()=>setPrintBatch(null)}/>}
  {camFor&&<Camera onClose={()=>setCamFor(null)} onCapture={b=>addPhotoBlob(camFor,b)}/>}
  {permOpen&&isSuper&&<PermPanel cfg={cfg} onClose={()=>setPermOpen(false)} onSave={saveCfg}/>}
 </div>
 </L.Provider>;
}

/* ---------- 概览 ---------- */
function Dashboard({assets,PAL,onGoto,onOpen}){
 const {t,sl,cl,nm}=useL();
 const s=useMemo(()=>{const by=k=>{const m={};assets.forEach(a=>{m[a[k]]=(m[a[k]]||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1])};const inuse=assets.filter(a=>a.status==="在用");const scrap=assets.filter(a=>DISPOSE.includes(a.status));const recent=assets.flatMap(a=>(a.hist||[]).map(h=>({...h,id:a.id,a}))).filter(h=>/^\d{4}-/.test(h.d)).sort((x,y)=>y.d.localeCompare(x.d)).slice(0,8);return{total:assets.length,inuse:inuse.length,scrap:scrap.length,todo:assets.filter(a=>a.status!=="报废"&&(!a.user||!a.location)).length,valAll:assets.reduce((s,a)=>s+(a.val||0),0),valInuse:inuse.reduce((s,a)=>s+(a.val||0),0),byDept:by("dept"),byStat:by("status"),byCat:by("cat"),recent};},[assets]);
 const maxD=Math.max(...s.byDept.map(d=>d[1]),1),maxC=Math.max(...s.byCat.map(d=>d[1]),1);
 return <div className="max-w-[1080px] mx-auto px-6 lg:px-10 py-8">
  <H title={t("dash")} en="Overview"/>
  <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-5">
   <Kpi n={s.total} l={t("total")} onClick={()=>onGoto({})}/>
   <Kpi n={s.inuse} l={t("inUse")} c={STATUS["在用"].c} onClick={()=>onGoto({status:"在用"})}/>
   <Kpi n={s.scrap} l={t("disposed")} c={STATUS["报废"].c} onClick={()=>onGoto({status:"报废"})}/>
   <Kpi n={s.todo} l={t("todo")} sub={t("todoSub")} c="#B08A3F"/>
  </div>
  <div className="grid grid-cols-2 gap-3 mt-3">
   <Card><div style={{color:SUB}} className="text-[11px] mb-1">{t("valInuse")}</div><div className="text-[22px] font-medium tabular-nums">฿ {fmt(s.valInuse)}</div></Card>
   <Card><div style={{color:SUB}} className="text-[11px] mb-1">{t("valAll")}</div><div className="text-[22px] font-medium tabular-nums">฿ {fmt(s.valAll)}</div></Card>
  </div>
  <div className="grid lg:grid-cols-2 gap-3 mt-3">
   <Card><CardTitle>{t("byDept")}</CardTitle><div className="space-y-2 mt-3">
    {s.byDept.map(([d,n])=><button key={d} onClick={()=>onGoto({dept:d})} className="w-full flex items-center gap-2.5 group">
     <span style={{background:PAL[d]||"#999",width:9,height:9,borderRadius:2}} className="shrink-0"/>
     <span className="text-[12px] w-9 text-left shrink-0">{d}</span>
     <span className="flex-1 h-[7px] rounded-full overflow-hidden" style={{background:"#EFEDE7"}}><span style={{width:`${n/maxD*100}%`,background:PAL[d]||"#999",display:"block",height:"100%"}}/></span>
     <span style={{color:SUB}} className="text-[11.5px] tabular-nums w-8 text-right shrink-0">{n}</span></button>)}
   </div></Card>
   <div className="space-y-3">
    <Card><CardTitle>{t("byStat")}</CardTitle><div className="flex flex-wrap gap-2 mt-3">
     {s.byStat.map(([st,n])=><button key={st} onClick={()=>onGoto({status:st})} style={{background:(STATUS[st]||{}).b||"#eee",color:(STATUS[st]||{}).c||"#555"}} className="px-2.5 py-1.5 rounded-md text-[12px] flex items-center gap-1.5"><b className="tabular-nums">{n}</b>{sl(st)}</button>)}
    </div></Card>
    <Card><CardTitle>{t("byCat")}</CardTitle><div className="space-y-1.5 mt-3">
     {s.byCat.map(([c,n])=><button key={c} onClick={()=>onGoto({cat:c})} className="w-full flex items-center gap-2.5 group">
      <span className="text-[12px] w-[92px] text-left shrink-0 truncate">{cl(c)}</span>
      <span className="flex-1 h-[7px] rounded-full overflow-hidden" style={{background:"#EFEDE7"}}><span style={{width:`${n/maxC*100}%`,background:AI,opacity:.8,display:"block",height:"100%"}}/></span>
      <span style={{color:SUB}} className="text-[11.5px] tabular-nums w-8 text-right shrink-0">{n}</span></button>)}
    </div></Card>
   </div>
  </div>
  <Card className="mt-3"><CardTitle>{t("recent")}</CardTitle>
   {s.recent.length===0?<div style={{color:SUB}} className="text-[12px] mt-3">{t("noRecent")}</div>:
    <ol className="mt-3 divide-y" style={{borderColor:LINE}}>{s.recent.map((h,i)=><li key={i}><button onClick={()=>onOpen(h.id)} className="w-full flex items-center gap-3 py-2 text-left hover:bg-stone-50 rounded px-1 -mx-1">
     <span style={{color:SUB}} className="text-[11.5px] tabular-nums w-[70px] shrink-0">{h.d}</span>
     <span className="px-1.5 rounded text-[11px] shrink-0" style={{background:"#F1EFE9"}}>{sl(h.t)}</span>
     <span className="text-[12.5px] truncate">{nm(h.a)}</span></button></li>)}</ol>}
  </Card>
 </div>;
}

/* ---------- 台账 ---------- */
function Ledger({assets,depts,cats,PAL,q,setQ,fDept,setFDept,fStat,setFStat,fCat,setFCat,open,onAdd}){
 const {t,sl,cl,nm,perms}=useL();
 const list=useMemo(()=>{const s=q.trim().toLowerCase();return assets.filter(a=>{if(fDept&&a.dept!==fDept)return false;if(fStat&&a.status!==fStat)return false;if(fCat&&a.cat!==fCat)return false;if(s&&![a.id,a.cn,a.en,a.th,a.sn,a.gb,a.old,a.user,a.location,a.manager].join(" ").toLowerCase().includes(s))return false;return true;});},[assets,q,fDept,fStat,fCat]);
 return <div className="max-w-[1080px] mx-auto px-6 lg:px-10 py-8">
  <div className="flex items-end justify-between gap-4 flex-wrap"><H title={t("ledger")} en="Ledger"/>
   <div className="flex items-center gap-2">
    <div className="relative"><span className="absolute left-2.5 top-1/2 -translate-y-1/2" style={{color:SUB}}><Svg n="search" s={14}/></span><input value={q} onChange={e=>setQ(e.target.value)} placeholder={t("search")} style={{background:"#fff",border:`1px solid ${LINE}`}} className="pl-8 pr-3 h-9 w-[240px] rounded-md outline-none focus:border-stone-400 text-[12.5px]"/></div>
    {perms.add&&<button onClick={onAdd} style={{background:AI}} className="h-9 px-3.5 rounded-md text-white flex items-center gap-1.5 text-[12.5px] hover:opacity-90"><Svg n="plus" s={15}/>{t("add")}</button>}
   </div>
  </div>
  <div className="flex items-center gap-2 flex-wrap mt-4">
   <Select v={fDept} set={setFDept} opts={depts.map(d=>[d,d])} ph={t("allDept")}/>
   <Select v={fStat} set={setFStat} opts={STLIST.map(s=>[s,sl(s)])} ph={t("allStat")}/>
   <Select v={fCat} set={setFCat} opts={cats.map(c=>[c,cl(c)])} ph={t("allCat")}/>
   {(fDept||fStat||fCat||q)&&<button onClick={()=>{setFDept("");setFStat("");setFCat("");setQ("");}} style={{color:SUB}} className="text-[12px] underline underline-offset-2 ml-1">{t("clear")}</button>}
   <span style={{color:SUB}} className="ml-auto text-[12px]">{list.length} {t("items")}</span>
  </div>
  <div style={{background:"#fff",border:`1px solid ${LINE}`}} className="rounded-lg overflow-hidden mt-3">
   {list.length===0&&<div className="px-4 py-16 text-center" style={{color:SUB}}>{t("noMatch")}</div>}
   {list.map(a=><button key={a.id} onClick={()=>open(a.id)} style={{borderBottom:`1px solid ${LINE}`}} className="w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-stone-50">
    <div className="min-w-0 flex-1">
     <div className="flex items-center gap-2"><span className="truncate">{nm(a)}</span><span style={{color:SUB}} className="text-[11px] tabular-nums shrink-0 hidden sm:inline">{a.id}</span></div>
     <div style={{color:SUB}} className="text-[11px] truncate mt-0.5 flex items-center gap-1.5"><Dept d={a.dept}/>{a.user&&<span className="shrink-0">· {a.user}</span>}{a.location&&<span className="truncate">· {a.location}</span>}</div>
    </div>
    <Badge s={a.status}/>
   </button>)}
  </div>
 </div>;
}
function Sub({a}){const {lang}=useL();const second= lang==="zh"?(a.en||a.th):a.cn; return second?<div style={{color:SUB}} className="truncate text-[11px]">{second}</div>:null;}

/* ---------- 划拨记录 ---------- */
function Transfers({assets,open}){
 const {t,nm}=useL();
 const rows=useMemo(()=>assets.flatMap(a=>(a.hist||[]).filter(h=>h.t==="划拨").map(h=>({...h,id:a.id,a}))).sort((x,y)=>(y.d||"").localeCompare(x.d||"")),[assets]);
 return <div className="max-w-[1080px] mx-auto px-6 lg:px-10 py-8"><H title={t("transfer")} en="Transfers"/>
  <div style={{background:"#fff",border:`1px solid ${LINE}`}} className="rounded-lg overflow-hidden mt-5">
   {rows.length===0&&<div className="px-4 py-16 text-center" style={{color:SUB}}>{t("noTransfer")}</div>}
   {rows.map((h,i)=><button key={i} onClick={()=>open(h.id)} style={{borderBottom:`1px solid ${LINE}`}} className="w-full text-left px-4 py-3 flex items-start gap-3 hover:bg-stone-50">
    <span style={{color:SUB}} className="text-[11px] tabular-nums shrink-0 w-[70px]">{h.d}</span>
    <div className="min-w-0 flex-1"><div className="truncate">{nm(h.a)}</div><div className="truncate text-[12px] mt-0.5" style={{color:"#5C594F"}}>{h.x}</div></div></button>)}

 </div>;

/* ---------- 报废与去向 ---------- */
function Disposal({assets,open}){
 const {t,sl,nm}=useL();
 const rows=useMemo(()=>assets.filter(a=>DISPOSE.includes(a.status)).map(a=>{const h=[...(a.hist||[])].reverse().find(x=>DISPOSE.includes(x.t));return{...a,dd:h?.d||"—",reason:h?.x||""};}),[assets]);
 return <div className="max-w-[1080px] mx-auto px-6 lg:px-10 py-8"><H title={t("dispose")} en="Disposal"/>
  <div style={{color:SUB}} className="text-[12px] mt-2">{t("disposeDesc")} {rows.length} {t("items")}.</div>
  <div style={{background:"#fff",border:`1px solid ${LINE}`}} className="rounded-lg overflow-hidden mt-4">
   {rows.length===0&&<div className="px-4 py-16 text-center" style={{color:SUB}}>—</div>}
   {rows.map(a=><button key={a.id} onClick={()=>open(a.id)} style={{borderBottom:`1px solid ${LINE}`}} className="w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-stone-50">
    <div className="min-w-0 flex-1"><div className="flex items-center gap-2"><span className="truncate">{nm(a)}</span></div><div style={{color:SUB}} className="text-[11px] truncate mt-0.5 flex items-center gap-1.5"><Dept d={a.dept}/><span>· {a.dd}</span>{a.reason&&<span className="truncate">· {a.reason}</span>}</div></div>
    <Badge s={a.status}/></button>)}
  </div>
 </div>;
}

/* ---------- 标贴 ---------- */
function Labels({assets,depts,onPrintOne,onPrintBatch}){
 const {t,nm}=useL();
 const [dept,setDept]=useState(""),[q,setQ]=useState(""),[picked,setPicked]=useState({});
 const list=useMemo(()=>{const s=q.trim().toLowerCase();return assets.filter(a=>a.status!=="报废"&&(!dept||a.dept===dept)&&(!s||[a.id,a.cn,a.en,a.th].join(" ").toLowerCase().includes(s)));},[assets,dept,q]);
 const sel=list.filter(a=>picked[a.id]); const allOn=list.length>0&&list.every(a=>picked[a.id]);
 return <div className="max-w-[1080px] mx-auto px-6 lg:px-10 py-8 pb-24"><H title={t("labels")} en="Labels"/>
  <div style={{color:SUB}} className="text-[12px] mt-2">{t("labelsDesc")}</div>
  <div className="flex items-center gap-2 flex-wrap mt-4">
   <Select v={dept} set={setDept} opts={depts.map(d=>[d,d])} ph={t("allDept")}/>
   <div className="relative"><span className="absolute left-2.5 top-1/2 -translate-y-1/2" style={{color:SUB}}><Svg n="search" s={14}/></span><input value={q} onChange={e=>setQ(e.target.value)} placeholder={t("search")} style={{background:"#fff",border:`1px solid ${LINE}`}} className="pl-8 pr-3 h-8 w-[180px] rounded-md outline-none focus:border-stone-400 text-[12px]"/></div>
   <button onClick={()=>{const np={...picked};list.forEach(a=>np[a.id]=!allOn);setPicked(np);}} style={{border:`1px solid ${LINE}`}} className="h-8 px-3 rounded-md text-[12px]">{allOn?t("unselectAll"):t("selectAll")}</button>
   <span style={{color:SUB}} className="ml-auto text-[12px]">{t("selected")} {sel.length} / {list.length}</span>
  </div>
  <div style={{background:"#fff",border:`1px solid ${LINE}`}} className="rounded-lg overflow-hidden mt-3">
   {list.map(a=><label key={a.id} style={{borderBottom:`1px solid ${LINE}`}} className="flex items-center gap-3 px-4 py-2.5 hover:bg-stone-50 cursor-pointer">
    <input type="checkbox" checked={!!picked[a.id]} onChange={e=>setPicked(p=>({...p,[a.id]:e.target.checked}))}/>
    <span style={{color:SUB}} className="text-[11.5px] tabular-nums w-[104px] hidden sm:inline shrink-0">{a.id}</span>
    <span className="truncate flex-1">{nm(a)}</span><Dept d={a.dept}/>
    <button onClick={e=>{e.preventDefault();onPrintOne(a);}} style={{border:`1px solid ${LINE}`}} className="h-7 px-2.5 rounded text-[11.5px] flex items-center gap-1"><Svg n="printer" s={12}/>{t("print")}</button>
   </label>)}
  </div>
  {sel.length>0&&<div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-30"><button onClick={()=>onPrintBatch(sel)} style={{background:AI}} className="h-10 px-5 rounded-full text-white text-[13px] shadow-lg flex items-center gap-2"><Svg n="printer" s={16}/>{t("printSel")} {sel.length}</button></div>}
 </div>;
}

/* ---------- 档案抽屉 ---------- */
function Drawer({cur,photos,edit,setEdit,patch,addPhotoFiles,delPhotoIdx,openCamera,close,transfer,dispose,print}){

 return <>

   <div className="sticky top-0 z-10 px-6 pt-5 pb-4" style={{background:"#fff",borderBottom:`1px solid ${LINE}`}}>
    <div className="flex items-start justify-between gap-3">
     <div className="min-w-0"><div className="flex items-center gap-2 mb-1"><Dept d={cur.dept}/><Badge s={cur.status}/></div>
      <div className="text-[17px] font-medium leading-snug">{nm(cur)}</div>
      <div style={{color:SUB}} className="text-[12px] leading-tight">{[cur.cn,cur.en,cur.th].filter(Boolean).filter(x=>x!==nm(cur)).join(" · ")}</div>

     </div>
     <button onClick={close} className="p-1.5 rounded hover:bg-stone-100 shrink-0"><Svg n="x" s={18}/></button>
    </div>
    <div className="flex items-center gap-1.5 mt-4 flex-wrap">
     {perms.transfer&&<Act ic="tf" label={t("aTransfer")} onClick={transfer}/>}
     {perms.dispose&&(DISPOSE.includes(cur.status)?<Act ic="rotate" label={t("aRestore")} onClick={()=>patch(cur.id,{status:"在用",disp:""},{d:today(),t:"恢复",x:"恢复为在用"})}/>:<Act ic="trash" label={t("aDispose")} onClick={dispose}/>)}
     <Act ic="printer" label={t("aLabel")} onClick={print}/>
     {perms.edit&&<Act ic={edit?"check":"pencil"} label={edit?t("aDone"):t("aEdit")} onClick={()=>setEdit(!edit)} primary={edit}/>}
    </div>
   </div>
   <div className="px-6 py-5 space-y-6">
    <Section title={t("basic")}><DL rows={[[t("sn"),cur.sn||"—"],[t("gb"),cur.gb||"—"],[t("old"),cur.old||"—"],[t("cat"),cl(cur.cat)],[t("cap"),cur.cap||"—"],[t("val"),fmt(cur.val)],[t("net"),fmt(cur.net)]]}/></Section>
    <Section title={t("mgmt")}>
     {edit?<div className="space-y-2.5"><Field label={t("sn")} v={cur.sn} on={v=>patch(cur.id,{sn:v})}/><Field label={t("user")} v={cur.user} on={v=>patch(cur.id,{user:v})}/><Field label={t("mgr")} v={cur.manager} on={v=>patch(cur.id,{manager:v})}/><Field label={t("loc")} v={cur.location} on={v=>patch(cur.id,{location:v})}/><Field label={t("note")} v={cur.note} on={v=>patch(cur.id,{note:v})} area/></div>
      :<DL rows={[[t("user"),cur.user||"—"],[t("mgr"),cur.manager||"—"],[t("loc"),cur.location||"—"],[t("note"),cur.note||"—"]]}/>}
    </Section>
    <Section title={t("photos")+"（"+(photos?.length||0)+"）"}>
     {(photos&&photos.length>0)&&<div className="grid grid-cols-3 gap-2 mb-2.5">{photos.map((p,i)=><div key={i} className="relative aspect-square rounded-md overflow-hidden" style={{border:`1px solid ${LINE}`}}><img src={p} className="w-full h-full object-cover"/>{perms.photo&&<button onClick={()=>delPhotoIdx(cur.id,i)} className="absolute top-1 right-1 p-0.5 rounded bg-white/90 hover:bg-white"><Svg n="x" s={12}/></button>}</div>)}</div>}
     {perms.photo&&<div className="flex gap-2">
      <button onClick={()=>openCamera(cur.id)} style={{border:`1px solid ${LINE}`}} className="h-9 px-3 rounded-md text-[12.5px] flex items-center gap-1.5 hover:bg-stone-50"><Svg n="camera" s={14}/>{t("takePhoto")}</button>
      <button onClick={()=>fileRef.current.click()} style={{border:`1px solid ${LINE}`}} className="h-9 px-3 rounded-md text-[12.5px] flex items-center gap-1.5 hover:bg-stone-50"><Svg n="image" s={14}/>{t("addPhotos")}</button>

     </div>}
    </Section>
    <Section title={t("history")}>{(cur.hist||[]).length===0?<div style={{color:SUB}} className="text-[12px]">{t("noHist")}</div>:
     <ol className="space-y-2.5">{[...(cur.hist||[])].reverse().map((h,i)=><li key={i} className="flex gap-3 text-[12px]"><span className="tabular-nums shrink-0" style={{color:SUB,minWidth:62}}>{h.d}</span><span className="shrink-0 px-1.5 rounded" style={{background:"#F1EFE9"}}><StT t={h.t}/></span><span style={{color:"#5C594F"}}>{h.x}</span></li>)}</ol>}
    </Section>
   </div>
  </aside>
 </>;
}
function StT({t:v}){const{sl}=useL();return STATUS[v]?sl(v):v;}

/* ---------- 通用 ---------- */
function H({title,en}){return <div className="flex items-baseline gap-2.5"><h1 style={{letterSpacing:".06em"}} className="text-[19px] font-medium">{title}</h1><span style={{color:SUB}} className="text-[11px]">{en}</span></div>;}
function Kpi({n,l,c,sub,onClick}){return <button onClick={onClick} style={{background:"#fff",border:`1px solid ${LINE}`}} className="rounded-lg px-4 py-3.5 text-left hover:border-stone-300"><div className="text-[26px] font-medium tabular-nums leading-none" style={{color:c||INK}}>{n}</div><div style={{color:SUB}} className="text-[11.5px] mt-1.5">{l}{sub&&<span className="block text-[10px]">{sub}</span>}</div></button>;}
function Card({children,className=""}){return <div style={{background:"#fff",border:`1px solid ${LINE}`}} className={"rounded-lg p-4 "+className}>{children}</div>;}
function CardTitle({children}){return <div style={{color:SUB,letterSpacing:".08em"}} className="text-[11px]">{children}</div>;}
function Select({v,set,opts,ph}){return <div className="relative"><select value={v} onChange={e=>set(e.target.value)} style={{background:"#fff",border:`1px solid ${LINE}`,color:v?INK:SUB}} className="h-8 pl-2.5 pr-7 rounded-md text-[12px] outline-none appearance-none focus:border-stone-400"><option value="">{ph}</option>{opts.map(([val,lab])=><option key={val} value={val}>{lab}</option>)}</select><span className="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none rotate-90" style={{color:SUB}}><Svg n="chev" s={13}/></span></div>;}
function Dept({d}){const{PAL}=useL();if(!d)return <span style={{color:"#C9C6BE"}}>—</span>;return <span className="inline-flex items-center gap-1.5 text-[11.5px]"><span style={{background:PAL[d]||"#999",width:8,height:8,borderRadius:2}}/>{d}</span>;}
function Badge({s}){const{sl}=useL();const st=STATUS[s]||{c:"#777",b:"#eee"};return <span style={{color:st.c,background:st.b}} className="inline-block px-2 py-[3px] rounded text-[11px] leading-none">{sl(s)}</span>;}
function Act({ic,label,onClick,primary}){return <button onClick={onClick} style={{border:`1px solid ${primary?AI:LINE}`,background:primary?AI:"#fff",color:primary?"#fff":INK}} className="h-8 px-2.5 rounded-md flex items-center gap-1.5 text-[12px] hover:bg-stone-50"><Svg n={ic} s={14}/>{label}</button>;}
function Section({title,children}){return <div><div style={{color:SUB,letterSpacing:".1em"}} className="text-[11px] mb-2.5">{title}</div>{children}</div>;}
function DL({rows}){return <dl className="grid grid-cols-2 gap-x-5 gap-y-2.5">{rows.map(([k,v],i)=><div key={i} className="min-w-0"><dt style={{color:SUB}} className="text-[11px] mb-0.5">{k}</dt><dd className="text-[12.5px] break-words tabular-nums">{v}</dd></div>)}</dl>;}
function Field({label,v,on,area}){return <label className="block"><span style={{color:SUB}} className="text-[11px]">{label}</span>{area?<textarea value={v||""} onChange={e=>on(e.target.value)} rows={2} style={{border:`1px solid ${LINE}`}} className="mt-1 w-full rounded-md px-2.5 py-1.5 text-[12.5px] outline-none focus:border-stone-400 resize-none"/>:<input value={v||""} onChange={e=>on(e.target.value)} style={{border:`1px solid ${LINE}`}} className="mt-1 w-full rounded-md px-2.5 h-8 text-[12.5px] outline-none focus:border-stone-400"/>}</label>;}
function Photo({label,url,onPick,onDel}){const{t}=useL();const ref=useRef();return <div><div style={{border:`1px solid ${LINE}`,background:"#FAF9F6"}} className="relative aspect-[4/3] rounded-md overflow-hidden flex items-center justify-center">{url?<img src={url} className="w-full h-full object-cover"/>:<div className="flex flex-col items-center gap-1" style={{color:"#C4C1B8"}}><Svg n="image" s={20}/><span className="text-[10.5px]">{t("noPhoto")}</span></div>}{url&&<button onClick={onDel} className="absolute top-1.5 right-1.5 p-1 rounded bg-white/90 hover:bg-white"><Svg n="x" s={13}/></button>}<button onClick={()=>ref.current.click()} className="absolute bottom-1.5 right-1.5 px-2 py-1 rounded bg-white/90 hover:bg-white flex items-center gap-1 text-[11px]"><Svg n="camera" s={12}/>{url?t("repPhoto"):t("addPhoto")}</button><input ref={ref} type="file" accept="image/*" className="hidden" onChange={e=>e.target.files[0]&&onPick(e.target.files[0])}/></div><div style={{color:SUB}} className="text-[11px] mt-1.5">{label}</div></div>;}

/* ---------- 弹窗 ---------- */
function Shell({title,onClose,children,wide}){return <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{background:"rgba(35,34,30,.32)"}} onClick={onClose}><div onClick={e=>e.stopPropagation()} style={{background:"#fff",border:`1px solid ${LINE}`}} className={"w-full "+(wide?"max-w-[520px]":"max-w-[400px]")+" rounded-xl overflow-hidden"}><div className="px-5 py-3.5 flex items-center justify-between" style={{borderBottom:`1px solid ${LINE}`}}><span className="text-[14px] font-medium" style={{letterSpacing:".04em"}}>{title}</span><button onClick={onClose} className="p-1 rounded hover:bg-stone-100"><Svg n="x" s={17}/></button></div><div className="p-5">{children}</div></div></div>;}
function Row({label,children}){return <label className="block mb-3"><span style={{color:SUB}} className="text-[11.5px]">{label}</span><div className="mt-1">{children}</div></label>;}
const inp={border:`1px solid ${LINE}`}, I="w-full rounded-md px-2.5 h-9 text-[13px] outline-none focus:border-stone-400";
function AddModal({depts,cats,onClose,onSave}){const{t,cl}=useL();const[f,setF]=useState({id:"",cn:"",en:"",th:"",sn:"",dept:depts[0]||"",cat:cats[0]||"",cap:today(),val:"",user:"",location:""});const set=(k,v)=>setF(p=>({...p,[k]:v}));
 return <Shell title={t("addAsset")} onClose={onClose} wide><div className="grid grid-cols-2 gap-x-4">
  <Row label={t("no")+" *"}><input value={f.id} onChange={e=>set("id",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("sn")}><input value={f.sn} onChange={e=>set("sn",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("nameZh")+" *"}><input value={f.cn} onChange={e=>set("cn",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("nameEn")}><input value={f.en} onChange={e=>set("en",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("nameTh")}><input value={f.th} onChange={e=>set("th",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("cap")}><input type="date" value={f.cap} onChange={e=>set("cap",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("dept")}><select value={f.dept} onChange={e=>set("dept",e.target.value)} style={inp} className={I}>{depts.map(d=><option key={d}>{d}</option>)}</select></Row>
  <Row label={t("cat")}><select value={f.cat} onChange={e=>set("cat",e.target.value)} style={inp} className={I}>{cats.map(c=><option key={c} value={c}>{cl(c)}</option>)}</select></Row>
  <Row label={t("val")}><input type="number" value={f.val} onChange={e=>set("val",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("user")}><input value={f.user} onChange={e=>set("user",e.target.value)} style={inp} className={I}/></Row>
  <div className="col-span-2"><Row label={t("loc")}><input value={f.location} onChange={e=>set("location",e.target.value)} style={inp} className={I}/></Row></div>
 </div><div className="flex justify-end gap-2 mt-2"><button onClick={onClose} style={{border:`1px solid ${LINE}`}} className="h-9 px-4 rounded-md text-[13px]">{t("cancel")}</button><button disabled={!f.id||!f.cn} onClick={()=>onSave({...f,val:Number(f.val)||0,net:Number(f.val)||0,gb:"",old:"",photos:[],status:"在用"})} style={{background:f.id&&f.cn?AI:"#C9C6BE"}} className="h-9 px-4 rounded-md text-white text-[13px]">{t("save")}</button></div></Shell>;}
function TransferModal({cur,onClose,onSave}){const{t}=useL();const[f,setF]=useState({user:cur.user||"",manager:cur.manager||"",location:cur.location||"",note:"",date:today()});const set=(k,v)=>setF(p=>({...p,[k]:v}));
 return <Shell title={t("transferTitle")} onClose={onClose}><div style={{color:SUB}} className="text-[12px] mb-3">{t("curUser")}：{cur.user||"—"}</div>
  <Row label={t("toUser")}><input value={f.user} onChange={e=>set("user",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("mgr")}><input value={f.manager} onChange={e=>set("manager",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("newLoc")}><input value={f.location} onChange={e=>set("location",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("date")}><input type="date" value={f.date} onChange={e=>set("date",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("note")}><input value={f.note} onChange={e=>set("note",e.target.value)} placeholder={t("transferReason")} style={inp} className={I}/></Row>
  <div className="flex justify-end gap-2 mt-1"><button onClick={onClose} style={{border:`1px solid ${LINE}`}} className="h-9 px-4 rounded-md text-[13px]">{t("cancel")}</button><button onClick={()=>onSave({...f,from:cur.user})} style={{background:AI}} className="h-9 px-4 rounded-md text-white text-[13px]">{t("confirmTransfer")}</button></div></Shell>;}
function DisposeModal({onClose,onSave}){const{t,sl}=useL();const[f,setF]=useState({status:"报废",reason:"",date:today()});const set=(k,v)=>setF(p=>({...p,[k]:v}));
 return <Shell title={t("disposeTitle")} onClose={onClose}><Row label={t("destination")}><div className="flex gap-1.5 flex-wrap">{DISPOSE.map(d=><button key={d} onClick={()=>set("status",d)} style={{border:`1px solid ${f.status===d?AI:LINE}`,background:f.status===d?AI:"#fff",color:f.status===d?"#fff":INK}} className="h-8 px-3 rounded-md text-[12.5px]">{sl(d)}</button>)}</div></Row>
  <Row label={t("reason")}><input value={f.reason} onChange={e=>set("reason",e.target.value)} style={inp} className={I}/></Row>
  <Row label={t("date")}><input type="date" value={f.date} onChange={e=>set("date",e.target.value)} style={inp} className={I}/></Row>
  <div className="flex justify-end gap-2 mt-1"><button onClick={onClose} style={{border:`1px solid ${LINE}`}} className="h-9 px-4 rounded-md text-[13px]">{t("cancel")}</button><button onClick={()=>onSave(f)} style={{background:"#B04A3F"}} className="h-9 px-4 rounded-md text-white text-[13px]">{t("confirm")}</button></div></Shell>;}

/* ---------- 打印 ---------- */
function LabelBox({a}){return <div style={{background:"#fff",width:"80mm",height:"50mm",border:"1px solid #000",padding:"3mm",fontFamily:"sans-serif",color:"#000",display:"flex",flexDirection:"column",boxSizing:"border-box"}}>
 <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1.5px solid #000",paddingBottom:"1.2mm"}}><b style={{fontSize:"3.4mm",letterSpacing:".3mm"}}>SAP 资产标贴</b><span style={{fontSize:"2.4mm"}}>GAMBOL (THAILAND)</span></div>
 <div style={{fontSize:"3.4mm",fontWeight:600,marginTop:"1.4mm"}}>{a.cn}</div><div style={{fontSize:"2.4mm",color:"#333"}}>{[a.en,a.th].filter(Boolean).join(" / ")}</div>
 <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.5mm 3mm",marginTop:"1.4mm",fontSize:"2.7mm"}}>
  <div><span style={{color:"#555"}}>SAP：</span>{a.id}</div><div><span style={{color:"#555"}}>公贝：</span>{a.gb||"—"}</div>
  <div><span style={{color:"#555"}}>旧号：</span>{a.old||"—"}</div><div><span style={{color:"#555"}}>部门：</span>{a.dept}</div>
  <div><span style={{color:"#555"}}>资本化：</span>{a.cap||"—"}</div><div><span style={{color:"#555"}}>原值฿：</span>{fmt(a.val)}</div></div>
 <div style={{marginTop:"auto",display:"flex",justifyContent:"space-between",alignItems:"flex-end",fontSize:"2.2mm",color:"#555"}}><span>使用人：{a.user||"____"}　位置：{a.location||"____"}</span><span>{a.dept}</span></div>
</div>;}
function PrintLabel({a,onDone}){const{t}=useL();useEffect(()=>{const tm=setTimeout(()=>window.print(),150);const h=()=>onDone();window.addEventListener("afterprint",h);return()=>{clearTimeout(tm);window.removeEventListener("afterprint",h);};},[]);
 return <div className="fixed inset-0 z-[60] flex items-center justify-center p-6 print-wrap" style={{background:"rgba(35,34,30,.4)"}} onClick={onDone}>
  <style>{`@media print{body *{visibility:hidden!important}.print-area,.print-area *{visibility:visible!important}.print-area{position:absolute;left:10mm;top:10mm}.print-wrap{background:none!important}}`}</style>
  <div onClick={e=>e.stopPropagation()} className="print-area"><LabelBox a={a}/></div>
  <div className="fixed bottom-6 left-1/2 -translate-x-1/2 flex gap-2 no-print"><button onClick={()=>window.print()} className="h-9 px-4 rounded-md text-[13px] bg-white border">{t("reprint")}</button><button onClick={onDone} style={{background:AI,color:"#fff"}} className="h-9 px-4 rounded-md text-[13px]">{t("close")}</button></div>
 </div>;}
function BatchPrint({list,onDone}){const{t}=useL();useEffect(()=>{const tm=setTimeout(()=>window.print(),250);const h=()=>onDone();window.addEventListener("afterprint",h);return()=>{clearTimeout(tm);window.removeEventListener("afterprint",h);};},[]);
 return <div className="fixed inset-0 z-[60] overflow-auto print-wrap" style={{background:"rgba(35,34,30,.5)"}}>
  <style>{`@media print{body *{visibility:hidden!important}.print-area,.print-area *{visibility:visible!important}.print-area{position:absolute;left:0;top:0}.print-wrap{background:#fff!important}} .print-area{display:grid;grid-template-columns:80mm 80mm;gap:6mm;padding:10mm}`}</style>
  <div className="print-area">{list.map(a=><LabelBox key={a.id} a={a}/>)}</div>
  <div className="fixed bottom-6 left-1/2 -translate-x-1/2 flex gap-2 no-print"><button onClick={()=>window.print()} className="h-9 px-4 rounded-md text-[13px] bg-white border">{t("print")}</button><button onClick={onDone} style={{background:AI,color:"#fff"}} className="h-9 px-4 rounded-md text-[13px]">{t("close")}</button></div>
 </div>;}

/* ---------- 摄像头拍照 ---------- */
function Camera({onClose,onCapture}){
 const {t}=useL(); const vid=useRef(); const stream=useRef(); const [err,setErr]=useState(false); const [shot,setShot]=useState(null);
 useEffect(()=>{(async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});stream.current=s;if(vid.current){vid.current.srcObject=s;await vid.current.play();}}catch(e){setErr(true);}})();return()=>{if(stream.current)stream.current.getTracks().forEach(t=>t.stop());};},[]);
 function snap(){const v=vid.current;if(!v)return;const cv=document.createElement("canvas");cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext("2d").drawImage(v,0,0);cv.toBlob(b=>setShot({blob:b,url:URL.createObjectURL(b)}),"image/jpeg",0.8);}
 return <div className="fixed inset-0 z-[70] flex items-center justify-center p-4" style={{background:"rgba(0,0,0,.75)"}}>
  <div style={{background:"#111"}} className="rounded-xl overflow-hidden w-full max-w-[540px]">
   <div className="relative bg-black flex items-center justify-center" style={{aspectRatio:"4/3"}}>
    {err?<div className="text-white/85 text-[13px] p-6 text-center leading-relaxed">{t("noCamera")}</div>
     :shot?<img src={shot.url} className="w-full h-full object-contain"/>:<video ref={vid} playsInline muted className="w-full h-full object-contain"/>}
   </div>
   <div className="flex items-center justify-between gap-2 p-3" style={{background:"#1b1b1b"}}>
    <button onClick={onClose} className="h-9 px-4 rounded-md text-[13px] text-white/85" style={{border:"1px solid #444"}}>{t("close")}</button>
    {!err&&(shot?<div className="flex gap-2"><button onClick={()=>{URL.revokeObjectURL(shot.url);setShot(null);}} className="h-9 px-4 rounded-md text-[13px] text-white" style={{border:"1px solid #444"}}>{t("retake")}</button><button onClick={()=>{onCapture(shot.blob);onClose();}} style={{background:AI}} className="h-9 px-5 rounded-md text-[13px] text-white">{t("usePhoto")}</button></div>
     :<button onClick={snap} title={t("capture")} style={{background:"#fff",border:"3px solid #888"}} className="h-12 w-12 rounded-full"/>)}
   </div>
  </div>
 </div>;
}

/* ---------- 登录 ---------- */
function Login({t,ready,onLogin}){
 const [u,setU]=useState(""),[p,setP]=useState(""),[e,setE]=useState(false);
 const go=()=>{if(!ready)return;if(!onLogin(u,p))setE(true);};
 return <div className="fixed inset-0 z-[90] flex items-center justify-center p-4" style={{background:PAPER}}>
  <div style={{background:"#fff",border:`1px solid ${LINE}`}} className="w-full max-w-[360px] rounded-2xl p-8">
   <div style={{letterSpacing:".16em"}} className="text-[17px] font-medium text-center">資産管理</div>
   <div style={{color:SUB}} className="text-[11px] text-center mt-1">GAMBOL Asset System</div>
   <div className="mt-6 space-y-3">
    <label className="block"><span style={{color:SUB}} className="text-[11.5px]">{t("account")}</span><input value={u} onChange={ev=>{setU(ev.target.value);setE(false);}} onKeyDown={ev=>ev.key==="Enter"&&go()} autoFocus style={{border:`1px solid ${LINE}`}} className="mt-1 w-full rounded-md px-3 h-10 text-[13px] outline-none focus:border-stone-400"/></label>
    <label className="block"><span style={{color:SUB}} className="text-[11.5px]">{t("password")}</span><input type="password" value={p} onChange={ev=>{setP(ev.target.value);setE(false);}} onKeyDown={ev=>ev.key==="Enter"&&go()} style={{border:`1px solid ${LINE}`}} className="mt-1 w-full rounded-md px-3 h-10 text-[13px] outline-none focus:border-stone-400"/></label>
    {e&&<div style={{color:"#B04A3F"}} className="text-[12px]">{t("loginErr")}</div>}
    <button onClick={go} style={{background:ready?AI:"#C9C6BE"}} className="w-full h-10 rounded-md text-white text-[13px]">{ready?t("login"):t("clouding")}</button>
   </div>
  </div>
 </div>;
}
/* ---------- 权限管理(超级管理员) ---------- */
function PermPanel({cfg,onClose,onSave}){
 const {t}=useL();
 const [list,setList]=useState(()=>JSON.parse(JSON.stringify(cfg.accounts||[])));
 const pk=[["edit",t("aEdit")],["add",t("add")],["transfer",t("aTransfer")],["dispose",t("aDispose")],["photo",t("photos")]];
 const upd=(i,f)=>setList(l=>l.map((a,j)=>j===i?{...a,...f}:a));
 const updP=(i,k,v)=>setList(l=>l.map((a,j)=>j===i?{...a,perms:{...a.perms,[k]:v}}:a));
 const addSub=()=>setList(l=>[...l,{u:"user"+(l.length+1),p:"Pass@2026",role:"sub",name:"子管理员"+l.length,perms:{edit:true,add:true,transfer:true,dispose:true,photo:true}}]);
 const del=i=>setList(l=>l.filter((_,j)=>j!==i));
 return <Shell title={t("permMgmt")} onClose={onClose} wide>
  <div className="space-y-3" style={{maxHeight:"58vh",overflowY:"auto"}}>
   {list.map((a,i)=><div key={i} style={{border:`1px solid ${LINE}`}} className="rounded-lg p-3">
     <div className="flex items-center gap-2">
       <input value={a.name} onChange={e=>upd(i,{name:e.target.value})} style={{border:`1px solid ${LINE}`}} className="rounded px-2 h-8 text-[12.5px] w-28 outline-none"/>
       <span style={{color:a.role==="super"?"#B04A3F":SUB}} className="text-[11px]">{a.role==="super"?t("superAdmin"):t("subAdmin")}</span>
       {a.role!=="super"&&<button onClick={()=>del(i)} style={{color:"#B04A3F"}} className="ml-auto text-[11.5px]">{t("del")}</button>}
     </div>
     <div className="flex gap-3 mt-2 flex-wrap">
       <label style={{color:SUB}} className="text-[11px] flex items-center gap-1">{t("account")}<input value={a.u} onChange={e=>upd(i,{u:e.target.value})} disabled={a.role==="super"} style={{border:`1px solid ${LINE}`}} className="rounded px-2 h-7 text-[12px] w-24 outline-none"/></label>
       <label style={{color:SUB}} className="text-[11px] flex items-center gap-1">{t("password")}<input value={a.p} onChange={e=>upd(i,{p:e.target.value})} style={{border:`1px solid ${LINE}`}} className="rounded px-2 h-7 text-[12px] w-28 outline-none"/></label>
     </div>
     {a.role!=="super"&&<div className="flex flex-wrap gap-3 mt-2">
       {pk.map(([k,lb])=><label key={k} className="flex items-center gap-1 text-[12px]"><input type="checkbox" checked={!!(a.perms&&a.perms[k])} onChange={e=>updP(i,k,e.target.checked)}/>{lb}</label>)}
     </div>}
   </div>)}
  </div>
  <div className="flex items-center justify-between mt-3">
   <button onClick={addSub} style={{border:`1px solid ${LINE}`}} className="h-9 px-3 rounded-md text-[12.5px]">+ {t("subAdmin")}</button>
   <div className="flex gap-2"><button onClick={onClose} style={{border:`1px solid ${LINE}`}} className="h-9 px-4 rounded-md text-[13px]">{t("cancel")}</button><button onClick={()=>{onSave({...cfg,accounts:list});onClose();}} style={{background:AI}} className="h-9 px-4 rounded-md text-white text-[13px]">{t("save")}</button></div>
  </div>
 </Shell>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
